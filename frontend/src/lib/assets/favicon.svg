	<rect x="0.75" y="0.75" width="22.5" height="22.5" rx="5.5" fill="url(#clay)" />
	<!-- V Ember: the guardian V cradles a rising three-tongue hearth flame.
	     The mark's ink box (stroke caps included) spans y 3.6-18.65, so its
	     centre is y=11.125, not 12 — scale about that point and land it on
	     the tile centre, nudged +0.3 down so the V's top-heavy mass reads
	     optically centred. 0.9 keeps the arm caps clear of the corner radius. -->
	<g transform="translate(12 12.3) scale(0.9) translate(-12 -11.125)">
		<path d="M4 5 L9.5 15.5 Q12 19 14.5 15.5 L20 5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
