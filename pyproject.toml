[project]
name = "vesta"
version = "0.1.0"
description = "Offline-first knowledge appliance over Kiwix ZIM archives"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.26.0",
    "lancedb>=0.37.1",
    "libzim>=3.12.0",
    "numpy>=2.5.1",
    "onnxruntime>=1.28.0",
    "openai>=2.52.0",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.24.0",
    "pypdfium2>=5.13.0",
    "pyyaml>=6.0.3",
    "resiliparse>=1.0.9",
    "sqlite-vec>=0.1.9",
    "structlog>=26.1.0",
    "tokenizers>=0.23.1",
    "uvicorn[standard]>=0.52.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
vesta = "vesta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vesta"]

[tool.hatch.build.targets.wheel.force-include]
"src/vesta/db/migrations" = "vesta/db/migrations"
"src/vesta/eval/golden" = "vesta/eval/golden"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
    "error",
    # pytest-asyncio & aiosqlite emit benign deprecations on 3.13.
    "ignore::DeprecationWarning:pytest_asyncio.*",
    "ignore::DeprecationWarning:aiosqlite.*",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle / pyflakes
    "I",               # isort
    "B",               # bugbear
    "UP",              # pyupgrade
    "SIM",             # simplify
    "C4",              # comprehensions
    "PL",              # pylint subset
    "RUF",             # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "PLR2004",# magic numbers in tests/config are fine
    "PLR0913",# arg count (DI constructors are explicit)
    "B008",   # FastAPI Depends() in default args is the canonical pattern
    "PLW0603",# module-global resolver is an intentional configured singleton
    "UP040",  # PEP 695 type aliases — cosmetic, keep TypeVar form for now
    "UP046",  # PEP 695 generic classes — cosmetic
    "UP047",  # PEP 695 generic functions — cosmetic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "SLF001", "TID252", "PLC0415", "SIM112", "B017"]
"src/vesta/**" = ["SLF001", "PLC0415"]  # package plumbing; lazy imports where needed
"src/vesta/api/answer.py" = ["PLR0911"]  # _serialize_event is a clean isinstance dispatch over 7 event types
"src/vesta/main.py" = ["PLR0915"]  # lifespan is the composition root; inherently multi-step

[tool.ruff.lint.pep8-naming]
# Allow shadowing builtins where the spec signature requires it.
ignore-names = ["type", "min", "max", "id"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
files = ["src/vesta"]

# Test code is not held to --strict; it exercises internals directly.
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
# aiosqlite ships minimal typed stubs; trust the runtime contract.
module = "aiosqlite.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "libzim.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# resiliparse ships no type stubs; trust the runtime contract.
module = "resiliparse.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# onnxruntime ships no py.typed marker; trust the runtime contract.
module = "onnxruntime.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# sqlite_vec ships no py.typed marker; trust the runtime contract.
module = "sqlite_vec.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pypdfium2 ships no py.typed marker; trust the runtime contract.
module = "pypdfium2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# openai's overloads for chat.completions.create are extremely strict about
# message dict shapes (TypedDict unions). We build messages from our own
# ChatMessage dataclass and cast — the runtime contract is OpenAI-compatible.
module = "openai.*"
disable_error_code = "call-overload, arg-type"

