name: entity
provenance: hand-written
entries:
  - id: e01
    query: Who developed the theory of general relativity?
    expected_paths: [Albert_Einstein]
    expected_fact: general relativity
    notes: Proper-noun entity lookup — the easy case for lexical retrieval.
  - id: e02
    query: What is the largest planet in the solar system?
    expected_paths: [Jupiter]
    expected_fact: "the largest in the Solar System"
  - id: e03
    query: Who was the 44th president of the United States?
    expected_paths: [Barack_Obama]
    expected_fact: "44th"
  - id: e04
    query: Which river has the largest discharge volume in the world?
    expected_paths: [Amazon_River]
    expected_fact: "largest river by discharge volume"
  - id: e05
    query: Who wrote the play Hamlet?
    expected_paths: [William_Shakespeare]
    expected_fact: Hamlet
  - id: e06
    query: What is the highest mountain on Earth?
    expected_paths: [Mount_Everest]
    expected_fact: "8,848"
  - id: e07
    query: Who was the first Roman emperor?
    expected_paths: [Roman_Empire, Augustus]
    expected_fact: Augustus
    notes: Augustus redirects here; either path is an acceptable hit.
  - id: e08
    query: Which ocean is the largest and deepest on Earth?
    expected_paths: [Pacific_Ocean]
    expected_fact: "largest and deepest"
  - id: e09
    query: Who overthrew the Byzantine Empire by conquering Constantinople in 1453?
    expected_paths: [Ottoman_Empire]
    expected_fact: "conquest of Constantinople in 1453"
  - id: e10
    query: What is the nickname of the fourth planet from the Sun?
    expected_paths: [Mars]
    expected_fact: Red Planet
